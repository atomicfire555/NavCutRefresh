name: Build NavCutRefresh

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # xNVSE commit the plugin was written and checked against
  XNVSE_REF: dfb7928077fd86e6498cb90af690547d1dd70de6

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Check out xNVSE SDK
        uses: actions/checkout@v4
        with:
          repository: xNVSE/NVSE
          ref: ${{ env.XNVSE_REF }}
          path: xnvse

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Put plugin source into the example project
        shell: pwsh
        run: |
          Copy-Item src\main.cpp xnvse\nvse_plugin_example\main.cpp -Force

      - name: Build Release | Win32
        run: >
          msbuild /m xnvse\nvse_plugin_example\nvse_plugin_example.sln
          /p:Configuration=Release /p:Platform=Win32
          /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false

      - name: Verify DLL (32-bit, exports NVSEPlugin_Query / NVSEPlugin_Load)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*HostX64\x86*' | Select-Object -First 1
          $dll = "xnvse\nvse_plugin_example\Release\nvse_plugin_example.dll"
          $hdr = & $dumpbin.FullName /headers $dll | Out-String
          $exp = & $dumpbin.FullName /exports $dll | Out-String
          Write-Output ($exp -split "`n" | Select-String "NVSEPlugin")
          if ($hdr -notmatch '14C machine \(x86\)') { throw "DLL is not 32-bit x86" }
          if ($exp -notmatch 'NVSEPlugin_Query' -or $exp -notmatch 'NVSEPlugin_Load') { throw "missing NVSE plugin exports" }

      - name: Package
        shell: pwsh
        run: |
          $out = "xnvse\nvse_plugin_example\Release"
          Copy-Item "$out\nvse_plugin_example.dll" package\NVSE\Plugins\NavCutRefresh.dll
          Copy-Item "$out\nvse_plugin_example.pdb" package\NVSE\Plugins\NavCutRefresh.pdb -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse package | Select-Object FullName, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NavCutRefresh
          path: package/
