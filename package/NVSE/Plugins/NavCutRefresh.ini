[Main]
; 0 turns the plugin off without uninstalling it
bEnabled=1
; how often (in frames) loaded cells are checked for moved obstacle objects
iScanEveryFrames=10
; a moved object must hold still this long (ms) before its navmesh cut is rebuilt
iSettleMs=400
; most cut rebuilds per scan, so placing or loading many objects at once doesn't spike
iMaxRefreshPerScan=24
; rebuild cuts of player-placed objects once when they're first seen after loading a save
; (fixes objects you built before installing this)
bRefreshPlayerPlacedOnLoad=1
; exterior cells checked around the player (2 = the normal 5x5 loaded grid)
iCellRadius=2
; 1 writes every rebuild to NavCutRefresh.log (for testing)
bVerboseLog=1
